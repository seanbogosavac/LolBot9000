services:
  lolbot:
    container_name: lolbot
    build:
      context: .
      args:
        # Set by the deploy workflow; "dev" for a manual build.
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: lolbot9000
    labels:
      glance.name: Lolbot9000
      glance.icon: assets/discord.svg
      glance.description: Discord bot
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # Keeps the SQLite player database across rebuilds and restarts.
      - players-db:/app/data

volumes:
  players-db:
